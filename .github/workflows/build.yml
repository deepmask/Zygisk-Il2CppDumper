name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17 # Updated to Java 17, as newer Gradle versions require it
        cache: gradle
        
    - name: Prepare and Build
      env:
        PACKAGE_NAME: ${{ github.event.inputs.package_name }}
      run: |
        chmod +x ./gradlew
        
        # Use a alternate separator '|' in case your input string gets messy
        sed -i "s|moduleDescription = \"|moduleDescription = \"($PACKAGE_NAME) |g" module.gradle
        sed -i "s|com.game.packagename|$PACKAGE_NAME|g" module/src/main/cpp/game.h
        
        ./gradlew :module:assembleRelease
        
    - uses: actions/upload-artifact@v5
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
